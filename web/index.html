<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#070907">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="rux">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>rux</title>
<style>
:root {
  --bg: #070907; --panel: #0a0d0a; --raise: #0f140f; --line: #172017;
  --text: #c8d5c8; --muted: #6c806c; --faint: #3a4a3b;
  --green: #3ee67a; --green-dim: #2b9c55; --green-bg: rgba(62, 230, 122, .07); --glow: 0 0 8px rgba(62, 230, 122, .35);
  --err: #ff6159; --warn: #e5c07b;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--bg); color: var(--text); }
body { font: 14px/1.6 var(--mono); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
::selection { background: var(--green); color: var(--bg); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: var(--text); background: transparent; border: 0; outline: 0; width: 100%; caret-color: var(--green); }
input::placeholder, textarea::placeholder { color: var(--faint); }
textarea { resize: none; }

/* layout: sidebar + pane on wide screens, one at a time on narrow */
#app { display: grid; height: 100dvh; grid-template-columns: 1fr; }
aside, .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
aside { background: var(--panel); }
@media (min-width: 900px) {
  #app { grid-template-columns: 320px 1fr; }
  aside { border-right: 1px solid var(--line); }
  .back { display: none !important; }
}
@media (max-width: 899px) {
  body[data-view="home"] .pane { display: none; }
  body:not([data-view="home"]) aside { display: none; }
  input, textarea { font-size: 16px; }
}

.bar { flex: none; height: calc(52px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 16px 0; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
.brand { color: var(--green); font-weight: 700; letter-spacing: .02em; text-shadow: var(--glow); }
.brand::before { content: "▌"; margin-right: 4px; }
.spacer { flex: 1; }
.pane-bar { padding-left: 0; padding-right: 0; }
.bar-in { display: flex; align-items: center; gap: 12px; height: 100%; }
.btn { border: 1px solid var(--green-dim); color: var(--green); padding: 3px 12px; border-radius: 4px; font-size: 13px; }
.btn:hover { background: var(--green-bg); }
.back { color: var(--green); font-size: 18px; width: 24px; }
.title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.icon-btn { color: var(--muted); padding: 4px 6px; border-radius: 4px; }
.icon-btn:hover { color: var(--green); background: var(--green-bg); }

/* status */
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.running { background: var(--green); box-shadow: var(--glow); animation: blink 1.2s steps(2, start) infinite; }
.dot.idle { background: var(--green-dim); }
.dot.failed { background: var(--err); }
.dot.provisioning, .dot.starting, .dot.destroying { background: var(--warn); animation: blink 1.2s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); white-space: nowrap; }

/* thread list */
.list { flex: 1; overflow-y: auto; padding: 6px 0 calc(env(safe-area-inset-bottom) + 12px); }
.row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 16px; border-left: 2px solid transparent; }
.row:hover { background: var(--raise); }
.row.sel { background: var(--green-bg); border-left-color: var(--green); }
.row .dot { margin-top: 7px; }
.row-main { flex: 1; min-width: 0; }
.row-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { color: var(--muted); padding: 24px 16px; }
.proj { display: flex; align-items: baseline; gap: 8px; padding: 14px 16px 4px; font-size: 12px; color: var(--muted); border-left: 2px solid transparent; }
.proj:first-child { padding-top: 8px; }
.proj:hover { color: var(--green); }
.proj.sel { color: var(--green); border-left-color: var(--green); background: var(--green-bg); }
.proj .pname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj .pname::before { content: "▸ "; color: var(--faint); }
.proj .pcount { flex: none; font-size: 11px; color: var(--faint); }
.proj .pcount.on { color: var(--green); }
.row.in-proj { padding-left: 26px; }
.row.gone { opacity: .45; }
/* project page */
.tpanel { margin: 16px 0 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 6px; }
.tpanel-h { display: flex; gap: 10px; align-items: baseline; font-size: 12px; color: var(--muted); padding: 2px 8px 4px; }
.tpanel-h b { font-weight: 400; flex: 1; }
.tpanel-h b::before { content: "# "; color: var(--faint); }
.tpanel-h a { color: var(--green-dim); }
.tpanel-h a:hover { color: var(--green); }
.tpanel .pnote { padding: 4px 8px 6px; font-size: 12px; color: var(--faint); }
.intro { color: var(--muted); padding: 28px 0 8px; font-size: 13px; line-height: 1.7; }
.intro b { color: var(--text); font-weight: 400; }
.step.wake .name { color: var(--green-dim); }
.psec { padding: 24px 0 4px; }
.psec h2 { font-size: 13px; font-weight: 400; color: var(--muted); margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
.psec h2::before { content: "#"; color: var(--faint); }
.psec h2 .spacer { flex: 1; }
.psec .new { padding: 0; }
.prow { display: flex; gap: 10px; align-items: baseline; padding: 7px 8px; border-radius: 4px; }
.prow:hover { background: var(--raise); }
.prow .dot { align-self: center; }
.prow .pt1 { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .pt2 { flex: none; font-size: 12px; color: var(--muted); }
.notes { width: 100%; min-height: 120px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 12px; line-height: 1.55; font-size: 13px; }
.notes:focus { border-color: var(--green-dim); }
.saved { font-size: 12px; color: var(--green-dim); }
.repo-line { font-size: 12px; color: var(--muted); margin-bottom: 4px; overflow-wrap: anywhere; }

main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.col { width: 100%; max-width: 920px; margin: 0 auto; padding: 0 20px; }
@media (max-width: 899px) { .col { padding: 0 16px; } }

/* new thread */
.new { padding: 28px 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
.new h2 { font-size: 13px; font-weight: 400; color: var(--muted); margin-bottom: 14px; }
.new h2::before { content: "# "; color: var(--faint); }
.prompt-wrap { display: flex; gap: 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 14px; }
.prompt-wrap:focus-within { border-color: var(--green-dim); }
.prompt-wrap::before { content: "›"; color: var(--green); text-shadow: var(--glow); }
.prompt { min-height: 140px; line-height: 1.6; }
.fields { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; margin-top: 14px; }
@media (min-width: 700px) { .fields { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; } .fields.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.field { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding: 10px 2px; }
.field label { color: var(--muted); flex: none; font-size: 13px; }
.field label::after { content: ":"; }
.field:focus-within { border-color: var(--green-dim); }
.clear { color: var(--faint); font-size: 12px; flex: none; }
.clear:hover { color: var(--green); }
.picks { display: grid; margin-top: 6px; min-width: 0; }
.pick { display: flex; align-items: baseline; gap: 10px; padding: 5px 8px; border-radius: 4px; font-size: 13px; text-align: left; min-width: 0; }
.pick:hover, .pick.hi { background: var(--green-bg); }
.pick:hover .pn, .pick.hi .pn { color: var(--green); }
.pick .pn { flex: none; max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick .pd { flex: 1; min-width: 0; color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick .pt { flex: none; color: var(--muted); font-size: 11.5px; }
.pick .lock { color: var(--warn); font-size: 11px; flex: none; }
select.sel { appearance: none; -webkit-appearance: none; font: inherit; color: var(--text); background: transparent; border: 0; outline: 0; width: 100%; cursor: pointer; padding: 0; }
select.sel option { background: var(--raise); color: var(--text); }
select.sel:disabled { color: var(--faint); cursor: default; }
.field:has(select.sel)::after { content: "▾"; color: var(--faint); font-size: 11px; }
.opts { display: flex; gap: 16px; font-size: 12px; color: var(--muted); padding: 0 0 6px 18px; }
.opts label { display: inline-flex; align-items: center; gap: 6px; }
.opts select.sel { width: auto; field-sizing: content; color: var(--green-dim); font-size: 12px; }
.opts select.sel:hover { color: var(--green); }
.opts select.sel:disabled { color: var(--faint); }
.picks .note { font-size: 12px; color: var(--faint); padding: 5px 8px; }
.actions { display: flex; align-items: center; gap: 14px; margin-top: 20px; }
.hint { color: var(--faint); font-size: 12px; }
.start { background: var(--green); color: var(--bg); font-weight: 700; padding: 8px 20px; border-radius: 4px; box-shadow: var(--glow); }
.start:disabled { opacity: .5; box-shadow: none; }
@media (max-width: 699px) { .start { width: 100%; padding: 12px; } .hint { display: none; } }

/* transcript */
.tx { padding: 20px 0 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.user { color: var(--green); white-space: pre-wrap; overflow-wrap: anywhere; display: flex; gap: 10px; padding: 8px 0 2px; }
.user::before { content: "›"; text-shadow: var(--glow); flex: none; }
.text { overflow-wrap: anywhere; }
.text p + p, .text p + pre, .text pre + p { margin-top: 10px; }
.text strong { color: #e4ede4; }
.text code { color: var(--green); background: var(--green-bg); padding: 0 4px; border-radius: 3px; }
pre { font: 12.5px/1.55 var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; overflow-x: auto; white-space: pre; color: var(--text); }
.step { color: var(--muted); font-size: 13px; }
.step > button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; min-height: 24px; }
.step > button:hover .name { color: var(--green); }
.step .sigil { color: var(--faint); flex: none; }
.step .name { color: var(--text); flex: none; }
.step .arg { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .mark { flex: none; font-size: 12px; }
.mark.ok { color: var(--green-dim); } .mark.err { color: var(--err); }
.step .detail { margin: 6px 0 4px 16px; display: grid; gap: 6px; }
.step .detail pre { max-height: 50vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
.step:not(.open) .detail { display: none; }
.err-line { color: var(--err); font-size: 13px; }
.err-line::before { content: "! "; }
.done { color: var(--faint); font-size: 12px; }
.done::before { content: "— "; }
.working { color: var(--muted); font-size: 13px; padding-bottom: 16px; }
.cursor { display: inline-block; width: .6em; height: 1.1em; background: var(--green); box-shadow: var(--glow); vertical-align: -2px; margin-left: 6px; animation: blink 1s steps(2, start) infinite; }

/* shared files */
.asset { display: grid; gap: 6px; justify-items: start; }
.asset .cap { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.asset .cap::before { content: "# "; color: var(--faint); }
.asset .cap a { color: var(--green-dim); margin-left: 8px; }
.asset img, .asset video { display: block; max-width: 100%; max-height: 60vh; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
.asset img { cursor: zoom-in; }
.asset .file { color: var(--green); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; font-size: 13px; }
.asset .file:hover { border-color: var(--green-dim); background: var(--green-bg); }
.step .detail img { max-width: 100%; max-height: 50vh; border: 1px solid var(--line); border-radius: 4px; cursor: zoom-in; }
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(2, 4, 2, .94); overflow: auto; display: grid; place-items: center; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.lightbox img { max-width: 100vw; max-height: 100dvh; cursor: zoom-in; }
.lightbox.full img { max-width: none; max-height: none; cursor: zoom-out; }
.lightbox .lb-bar { position: fixed; top: calc(env(safe-area-inset-top) + 10px); right: 12px; display: flex; gap: 8px; z-index: 1; }
.lightbox .lb-bar a, .lightbox .lb-bar button { background: rgba(10, 13, 10, .85); border: 1px solid var(--line); color: var(--green); border-radius: 4px; padding: 4px 10px; font-size: 13px; }

/* composer */
footer { flex: none; padding: 10px 0 calc(env(safe-area-inset-bottom) + 12px); border-top: 1px solid var(--line); background: var(--bg); }
.composer { display: flex; align-items: flex-end; gap: 10px; }
.composer::before { content: "›"; color: var(--green); text-shadow: var(--glow); padding: 6px 0; }
.composer textarea { max-height: 40vh; padding: 6px 0; line-height: 1.5; overflow-y: hidden; }
.send { flex: none; color: var(--green); border: 1px solid var(--green-dim); border-radius: 4px; padding: 4px 12px; font-size: 13px; }
.send:hover { background: var(--green-bg); }
.send:disabled { color: var(--faint); border-color: var(--line); background: none; }
.send.stop { color: var(--err); border-color: var(--err); }

/* menu */
.menu { position: relative; }
.menu-pop { position: absolute; right: 0; top: 34px; background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 6px; z-index: 5; width: 260px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
.menu-pop .info { font-size: 12px; color: var(--muted); padding: 4px 8px; overflow-wrap: anywhere; }
.menu-pop button { display: block; width: 100%; text-align: left; padding: 6px 8px; border-radius: 4px; font-size: 13px; }
.menu-pop button:hover { background: var(--green-bg); }
.menu-pop .danger { color: var(--err); }

/* work / monitor switch */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; font-size: 12px; flex: none; }
.seg a { padding: 2px 10px; color: var(--muted); }
.seg a:hover { color: var(--text); }
.seg a.on { background: var(--green-bg); color: var(--green); }

/* monitor */
body[data-mode="monitor"] #app { display: none; }
#monitor { display: flex; flex-direction: column; height: 100dvh; }
body:not([data-mode="monitor"]) #monitor { display: none; }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
.mon { flex: 1; overflow-y: auto; }
.mon-in { max-width: 1440px; margin: 0 auto; padding: 20px 20px calc(env(safe-area-inset-bottom) + 24px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.panel { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; min-width: 0; }
.panel-h { font-size: 12px; color: var(--muted); padding: 8px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; }
.panel-h b { font-weight: 400; flex: 1; }
.panel-h b::before { content: "# "; color: var(--faint); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.stat { padding: 12px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
.stat .k { font-size: 11.5px; color: var(--muted); }
.stat .v { font-size: 20px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v.g { color: var(--green); text-shadow: var(--glow); }
.stat .sub { font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { color: var(--green); letter-spacing: -.5px; font-size: 13px; }
.meter i { color: var(--faint); font-style: normal; }
.topo { position: relative; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, .9fr) minmax(0, 1.5fr); gap: 72px; padding: 22px; align-items: center; }
.topo svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.tcol { display: grid; gap: 10px; position: relative; z-index: 1; min-width: 0; }
.tcol-h { font-size: 11px; color: var(--faint); }
.node { display: block; border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 8px 10px; font-size: 12.5px; min-width: 0; }
.node.on { border-color: var(--green-dim); }
.node.off { opacity: .4; }
.node.host { border-color: var(--green-dim); box-shadow: 0 0 14px rgba(62, 230, 122, .12); padding: 12px; }
a.node:hover { border-color: var(--green); background: var(--green-bg); }
.node .n { display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .n span:not(.dot) { overflow: hidden; text-overflow: ellipsis; }
.node .s { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .tag { color: var(--green); font-size: 11px; margin-left: auto; flex: none; text-shadow: var(--glow); }
.mbar { height: 3px; background: var(--line); margin-top: 7px; border-radius: 2px; overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--green-dim); }
.faint-note { font-size: 11.5px; color: var(--faint); padding-left: 2px; }
.ln { stroke: var(--faint); stroke-width: 1; fill: none; }
.ln.dash { stroke-dasharray: 2 4; }
.ln.live { stroke: var(--green); stroke-width: 1.4; stroke-dasharray: 6 6; animation: flow .9s linear infinite; filter: drop-shadow(0 0 3px rgba(62, 230, 122, .7)); }
@keyframes flow { to { stroke-dashoffset: -12; } }
.hist { display: flex; align-items: flex-end; gap: 3px; height: 90px; padding: 16px 14px 6px; }
.hist i { flex: 1; background: var(--green-dim); min-height: 1px; border-radius: 1px 1px 0 0; opacity: .85; }
.hist i.now { background: var(--green); box-shadow: var(--glow); opacity: 1; }
.hist-x { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); padding: 0 14px 10px; }
@media (max-width: 899px) {
  .topo { grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 14px; }
  .topo svg { display: none; }
  .mon-in { padding: 14px 16px calc(env(safe-area-inset-bottom) + 24px); }
}
</style>
</head>
<body data-view="home" data-mode="work">
<div id="app">
  <aside>
    <div class="bar"><span class="brand">rux</span><span class="seg" data-seg></span><span class="spacer"></span><a class="btn" href="#/new">+ new</a></div>
    <div class="list" id="list"></div>
  </aside>
  <section class="pane">
    <div class="bar pane-bar"><div class="col bar-in" id="hdr"></div></div>
    <main id="main"></main>
    <footer id="ftr" hidden><div class="col" id="ftr-in"></div></footer>
  </section>
</div>
<div id="monitor">
  <div class="bar"><span class="brand">rux</span><span class="seg" data-seg></span><span class="spacer"></span><span class="live" id="live"></span></div>
  <main class="mon" id="mon"></main>
</div>
<script src="ui.js"></script>
<script>

  return s < 60 ? "now" : s < 3600 ? Math.floor(s / 60) + "m" : s < 86400 ? Math.floor(s / 3600) + "h" : Math.floor(s / 86400) + "d"; };

  function connect() {

}


// ---------- monitor ----------
const fmtGB = (b) => b >= 1 << 30 ? (b / (1 << 30)).toFixed(1) + "G" : Math.round(b / (1 << 20)) + "M";

const until = (sec) => { const s = sec - Date.now() / 1000; if (s <= 0) return "now";
  const d = Math.floor(s / 86400), hr = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);

}

function renderMonitor(ov) {

      h("div", { class: "n" }, h("span", { class: "dot " + state }), h("span", {}, g.thread_title || g.name), g.streaming ? h("span", { class: "tag" }, "streaming") : null),

function drawEdges() {
  const topo = $("#mon .topo");
  if (!topo) return;
  topo.querySelector("svg")?.remove();
  const box = topo.getBoundingClientRect();
  const NS = "http://www.w3.org/2000/svg";
  const svgEl = document.createElementNS(NS, "svg");
  const pos = (k) => { const el = topo.querySelector(`[data-k="${CSS.escape(k)}"]`); return el && el.getBoundingClientRect(); };
  const phase = `-${(Date.now() % 900) / 1000}s`; // keep the flow animation continuous across re-renders
  for (const e of monEdges) {
    const a = pos(e.a), b = pos(e.b);
    if (!a || !b) continue;
    const x1 = a.right - box.left, y1 = a.top + a.height / 2 - box.top, x2 = b.left - box.left, y2 = b.top + b.height / 2 - box.top;
    const mx = (x1 + x2) / 2;
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    p.setAttribute("class", e.cls);

// Minimal markdown -> DOM (never innerHTML): code fences, inline code, bold, headings, paragraphs.
function md(src) {
  const frag = document.createDocumentFragment();
  src.split(/```[^\n]*\n?/).forEach((chunk, i) => {
    if (i % 2) { frag.append(h("pre", {}, chunk.replace(/\n$/, ""))); return; }
    for (const para of chunk.split(/\n{2,}/)) {
      if (!para.trim()) continue;
      const p = h("p");
      para.split("\n").forEach((line, k) => {
        if (k) p.append(h("br"));
        const head = line.match(/^#{1,6}\s+(.*)$/);
        if (head) { p.append(h("strong", {}, head[1])); return; }
        line.split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach((s, j) => {
          if (!(j % 2)) p.append(s);
          else if (s[0] === "`") p.append(h("code", {}, s.slice(1, -1)));
          else p.append(h("strong", {}, s.slice(2, -2)));
        });
      });
      frag.append(p);
    }
  });
  return frag;
}
